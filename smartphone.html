        * {

body {

header {

.phone {
    background-color: white;

}

.phone img {
    width: 180px;
    height: 200px;
    object-fit: contain;
}

.phone h3 {

}

.phone h4 {
    font-size: 22px;
}

button {
    background-color: #222;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #555;
}

footer {
    margin-top: 40px;
    padding: 20px;
    background-color: #222;
    color: white;
    text-align: center;
}
